[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-protocol"
version = "0.2.0"
description = "Flow Gateway Protocol: pydantic models, a FastAPI router and a conformance CLI for backends that host the Flow UI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
dependencies = ["pydantic>=2.5", "httpx>=0.27"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "python-multipart>=0.0.9", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8", "fastapi>=0.110", "python-multipart>=0.0.9", "uvicorn[standard]>=0.29"]

[project.scripts]
flow-conformance = "flow_protocol.conformance:main"
flow-fake-gateway = "flow_protocol.examples.fake:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flow_protocol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
